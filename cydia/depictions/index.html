<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Package details · Marchrius Cydia Repository</title>
  <link rel="stylesheet" href="css/main.css">
  <script defer src="js/setDepiction.js"></script>
</head>
<body>
  <main class="page">
    <p><a id="repo-home" href="../">Marchrius Cydia Repository</a></p>
    <section class="card package-header">
      <h1 id="packageTitle">Package details</h1>
      <p id="bundleId" class="muted"></p>
      <p id="version" class="muted"></p>
    </section>
    <p id="load-error" class="card error" hidden>Impossibile caricare i dettagli del pacchetto.</p>
    <section class="card">
      <h2>Compatibilità</h2>
      <p id="compatibility"></p>
    </section>
    <section class="card">
      <h2>Descrizione</h2>
      <ul id="description"></ul>
    </section>
    <section class="card">
      <h2>Dipendenze</h2>
      <ul id="dependencies"></ul>
    </section>
    <section class="card">
      <h2>Registro modifiche</h2>
      <div id="changeLog"></div>
    </section>
  </main>
</body>
</html>
