name: Build and deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Compile stylesheets
        run: bundle exec compass compile --css-dir source/stylesheets

      - name: Build site
        run: bundle exec jekyll build

      - name: Publish static repository assets
        run: cp -R cydia public/cydia

      - name: Validate generated site
        run: |
          test -s public/index.html
          test -s public/stylesheets/screen.css
          test -s public/cydia/index.html
          test -s public/cydia/depictions/css/main.css

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
